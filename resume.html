<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent & Resume | Sam Wu (Light Neumorphic)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="animate-fade-in p-6 md:p-12 h-screen flex flex-col relative overflow-hidden">

    <div class="max-w-6xl mx-auto w-full mb-12 flex justify-between items-center flex-shrink-0 relative z-10">
        <a href="index.html" class="nm-button px-6 py-3 text-xs font-bold uppercase tracking-widest text-slate-600 hover:text-emerald-700 flex items-center gap-2">
            &larr; Back to Hub
        </a>
        <span class="text-xs font-mono tracking-widest text-emerald-700 uppercase font-bold relative z-10">Module: CV_AI</span>
    </div>

    <main class="max-w-6xl mx-auto w-full flex-1 grid grid-cols-1 lg:grid-cols-2 gap-12 relative z-10 h-full">
        
        <div class="nm-pressed p-8 md:p-10 flex flex-col h-full border border-gray-100 rounded-3xl">
            <div class="flex justify-between items-center mb-6 pb-6 border-b border-gray-100 flex-shrink-0">
                <h2 class="text-2xl font-black text-slate-950 uppercase tracking-widest relative z-10">Sam's AI Agent</h2>
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse relative z-10"></div>
            </div>

            <div id="chat-window" class="nm-inset flex-1 p-6 overflow-y-auto mb-8 custom-scrollbar border border-gray-100 relative z-0 h-[30svh]">
                <div class="flex items-start gap-4 mb-4">
                    <div class="w-10 h-10 rounded-full nm-panel flex items-center justify-center text-emerald-600 mr-4 flex-shrink-0 font-bold text-[10px] shadow-lg border border-gray-100 relative z-10">AI</div>
                    <span class="nm-panel text-slate-800 px-5 py-4 rounded-2xl rounded-tl-none text-sm leading-relaxed max-w-[85%] border border-gray-100 relative z-0">
                        Hello! Ask me about Sam's expertise in mathematics, robust data pipelines, full-stack AI integrations, or his specific project interest fields derived from the TIC project documentation.
                    </span>
                </div>
            </div>

            <form id="ai-chat-form" class="flex gap-4 relative z-10">
                <input type="text" id="ai-input" placeholder="Query data..." class="flex-1 nm-inset px-6 py-4 text-slate-900 text-sm focus:border-emerald-500 outline-noneplaceholder-gray-500 border border-gray-100">
                <button type="submit" class="nm-button px-8 font-bold text-xs uppercase tracking-widest text-emerald-700">Ask AI</button>
            </form>
        </div>

        <div class="nm-pressed p-6 bg-gray-50 flex flex-col h-full border border-gray-100 rounded-3xl relative z-0 overflow-y-auto custom-scrollbar">
            <p class="text-emerald-700 mb-6 border-b-2 border-emerald-200 font-mono font-bold tracking-widest uppercase relative z-10">// PDF VIEWER TRAY:</p>
            
            <div class="relative nm-inset p-1 border border-gray-100 flex items-center justify-center overflow-hidden h-full z-0">
                <iframe src="Yihang.Wu.pdf" alt="Credentials" class="w-full lg:w-[calc(100%+120px)] lg:-ml-12 border-none h-full scale-[1.01] saturate-[0.98] opacity-[0.98]"></iframe>
                
                <div class="absolute bottom-0 left-0 right-0 h-1.5 bg-gray-900 relative z-10"></div>
            </div>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
