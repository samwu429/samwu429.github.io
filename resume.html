<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent | Sam Wu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="p-6 md:p-12 min-h-screen flex flex-col animate-fade-in">

    <div class="max-w-6xl mx-auto w-full mb-12 flex justify-between items-center border-b-4 border-gray-900 pb-4">
        <a href="index.html" class="retro-button px-6 py-2 text-xs uppercase tracking-widest">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> BACK
        </a>
        <span class="text-xl font-black tracking-widest uppercase">Agent.EXE</span>
    </div>

    <main class="max-w-7xl mx-auto w-full flex-1 grid grid-cols-1 lg:grid-cols-2 gap-12">
        
        <div class="retro-panel flex flex-col h-[750px] overflow-hidden bg-gray-100">
            <div class="flex justify-between items-center px-8 py-4 bg-gray-900 border-b-4 border-gray-900">
                <h2 class="text-lg font-black text-white tracking-widest uppercase">Terminal: Sam_AI</h2>
                <div class="w-3 h-3 bg-emerald-500 border-2 border-white"></div>
            </div>

            <div class="bg-yellow-100 border-b-4 border-gray-900 p-4 font-mono text-sm font-bold text-gray-900">
                [NOTICE] Initial connection to free cloud tier requires ~50s delay.
            </div>

            <div id="chat-window" class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                <div class="flex items-start gap-4 mb-4">
                    <div class="w-10 h-10 retro-panel flex items-center justify-center text-gray-900 font-black text-[12px] flex-shrink-0 bg-emerald-200">AI</div>
                    <span class="retro-panel text-gray-900 px-6 py-4 text-sm font-bold max-w-[85%]">System Ready. Awaiting queries regarding Sam's professional experience.</span>
                </div>
            </div>

            <form id="ai-chat-form" class="flex p-4 bg-gray-200 border-t-4 border-gray-900 gap-4">
                <input type="text" id="ai-input" placeholder="Type command..." class="flex-1 retro-inset bg-white px-6 py-4 text-gray-900 font-bold text-sm focus:outline-none font-mono">
                <button type="submit" class="retro-button px-8 font-black text-xs uppercase tracking-widest bg-emerald-400">SEND</button>
            </form>
        </div>

        <div class="retro-panel flex flex-col h-[750px] overflow-hidden">
            <div class="flex justify-between items-center px-8 py-4 bg-gray-900 border-b-4 border-gray-900">
                <h2 class="text-lg font-black text-white tracking-widest uppercase">Document: CV</h2>
                <a href="Yihang.Wu.pdf" download class="retro-button px-4 py-2 text-[10px] font-black uppercase tracking-widest">Download</a>
            </div>
            
            <div class="flex-1 bg-gray-300 p-4">
                <iframe src="Yihang.Wu.pdf" class="w-full h-full border-4 border-gray-900 bg-white"></iframe>
            </div>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
