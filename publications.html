<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications & Writing | Sam Wu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="animate-fade-in py-6 md:py-12 px-0 min-h-screen flex flex-col relative overflow-x-hidden">

    <div class="site-wrap w-full mb-10 flex justify-between items-center relative z-10 border-b-2 border-gray-900 pb-4">
        <a href="index.html" class="retro-button px-6 py-2.5 text-xs font-black uppercase tracking-widest text-gray-800 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Back to Hub
        </a>
    </div>

    <main class="site-wrap w-full flex-1 relative z-10 pb-20 space-y-12 md:space-y-16">
        <header class="space-y-3 text-center max-w-2xl mx-auto">
            <p class="text-xs font-black tracking-[0.2em] text-emerald-800 uppercase">Research & writing</p>
            <h1 class="text-4xl md:text-5xl font-black text-gray-950 uppercase tracking-tight leading-none font-serif-heading">
                Publications <span class="text-emerald-700">&</span> blog
            </h1>
            <p class="text-sm md:text-base text-gray-600 font-medium body-readable">
                Choose what to read: the formal publications list, or the Moments-style photo feed.
            </p>
        </header>

        <!-- Hub: pick destination -->
        <nav class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 max-w-3xl mx-auto" aria-label="Choose publications or blog">
            <a href="#section-publications" class="retro-button tactile-button motion-safe p-8 md:p-10 flex flex-col items-center text-center gap-4 min-h-[11rem] justify-center group">
                <div class="retro-icon mb-1"><svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg></div>
                <span class="tracking-widest uppercase text-sm font-black text-gray-900">Publications<br><span class="text-xs text-gray-500 font-bold tracking-wide normal-case mt-2 block">Papers &amp; catalog</span></span>
                <span class="text-[10px] font-black text-emerald-700 uppercase tracking-widest">Scroll to list ↓</span>
            </a>
            <a href="blog.html" class="retro-button tactile-button motion-safe p-8 md:p-10 flex flex-col items-center text-center gap-4 min-h-[11rem] justify-center bg-emerald-50/40">
                <div class="retro-icon mb-1"><svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>
                <span class="tracking-widest uppercase text-sm font-black text-gray-900">Moments<br><span class="text-xs text-gray-500 font-bold tracking-wide normal-case mt-2 block">Blog · photo timeline</span></span>
                <span class="text-[10px] font-black text-emerald-700 uppercase tracking-widest">Open feed →</span>
            </a>
        </nav>

        <section id="section-publications" aria-labelledby="pub-heading" class="space-y-6 scroll-mt-24">
            <h2 id="pub-heading" class="section-title text-xl md:text-2xl">Publications catalog</h2>
            <div id="publications-list" class="grid grid-cols-1 gap-6"></div>
        </section>
    </main>

    <script src="api-config.js"></script>
    <script src="moments-public.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const MC = window.SAM_PUBLIC_CONTENT;
            if (!MC) return;
            MC.loadPublications(document.getElementById('publications-list'));
            if (window.location.hash === '#section-publications') {
                document.getElementById('section-publications')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    </script>
</body>
</html>
