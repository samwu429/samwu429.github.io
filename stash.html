<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="mask-icon" href="favicon.svg?v=2" color="#000000">
    <meta name="theme-color" content="#047857">
    <title>Archive | Yihang Wu</title>
    <link rel="preconnect" href="https://sam-api-backend.onrender.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css?v=17">
</head>
<body class="animate-fade-in py-6 md:py-12 px-0 min-h-screen flex flex-col relative overflow-x-hidden">

    <div class="site-wrap w-full mb-8 flex justify-between items-center relative z-10 border-b-2 border-gray-900 pb-4">
        <a href="index.html" class="retro-button px-6 py-2.5 text-xs font-black uppercase tracking-widest text-gray-800 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back
        </a>
        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em]">Loose shelf</span>
    </div>

    <main class="site-wrap w-full max-w-3xl mx-auto flex-1 relative z-10 pb-24">
        <header class="mb-8" id="stash-root-header">
            <p class="text-[11px] font-bold text-gray-500 uppercase tracking-[0.22em] mb-2">Misc archive</p>
            <h1 class="text-3xl md:text-4xl font-black text-gray-950 tracking-tight uppercase">Odds &amp; ends</h1>
            <p class="text-sm text-gray-600 font-medium mt-3 body-readable max-w-xl">
                Photos, clips, articles, and scratch notes that do not belong on the main hub. Unlisted — reach it from the corner mark on the home page.
            </p>
        </header>

        <div id="stash-breadcrumb"></div>
        <div id="stash-folder-header"></div>

        <nav class="stash-filter-bar mb-8" id="stash-filters" aria-label="Filter by type">
            <button type="button" class="stash-filter-btn is-active" data-filter="all">All</button>
            <button type="button" class="stash-filter-btn" data-filter="photo">Photos</button>
            <button type="button" class="stash-filter-btn" data-filter="video">Video</button>
            <button type="button" class="stash-filter-btn" data-filter="article">Articles</button>
            <button type="button" class="stash-filter-btn" data-filter="note">Notes</button>
        </nav>

        <div id="stash-folder-grid" class="stash-folder-grid hidden mb-8" aria-label="Folders"></div>

        <div id="stash-feed" class="space-y-4"></div>
    </main>

    <script src="api-config.js"></script>
    <script src="stash.js?v=6"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ST = window.SAM_STASH;
            if (!ST) return;

            const params = new URLSearchParams(window.location.search);
            const folderId = params.get('folder') || '';
            const feed = document.getElementById('stash-feed');
            const filters = document.getElementById('stash-filters');
            const breadcrumb = document.getElementById('stash-breadcrumb');
            const folderHeader = document.getElementById('stash-folder-header');
            const folderGrid = document.getElementById('stash-folder-grid');
            const rootHeader = document.getElementById('stash-root-header');
            let activeFilter = 'all';

            if (rootHeader) {
                rootHeader.classList.toggle('hidden', !!folderId);
            }

            function refresh() {
                ST.loadBrowse({
                    folderId,
                    filterKind: activeFilter,
                    breadcrumbEl: breadcrumb,
                    headerEl: folderHeader,
                    folderGridEl: folderGrid,
                    feedEl: feed
                });
            }

            if (filters) {
                filters.addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-filter]');
                    if (!btn) return;
                    activeFilter = btn.getAttribute('data-filter') || 'all';
                    filters.querySelectorAll('.stash-filter-btn').forEach((b) => {
                        b.classList.toggle('is-active', b === btn);
                    });
                    refresh();
                });
            }

            refresh();
        });
    </script>
</body>
</html>
