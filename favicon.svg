<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Yihang Wu monogram with phi">
  <title>Yihang Wu - phi</title>
  <defs>
    <linearGradient id="yhwStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#yhwStroke)" stroke-linecap="round" stroke-linejoin="round">
    <!-- phi: outer ellipse forms the rose-bud silhouette -->
    <ellipse cx="32" cy="32" rx="15" ry="20" stroke-width="2.6"/>
    <!-- phi: vertical stem extending above (leaf bud) and below (rose stalk) -->
    <line x1="32" y1="3.5" x2="32" y2="60.5" stroke-width="2.6"/>

    <!-- Y: two curling arms entering from the top of the ellipse, swept inward like outer petals -->
    <path d="M22 16.5 C24 22, 28 25, 32 26.5" stroke-width="2.2"/>
    <path d="M42 16.5 C40 22, 36 25, 32 26.5" stroke-width="2.2"/>

    <!-- H: Y arms curve outward becoming the H verticals (inner petals) -->
    <path d="M32 26.5 C28 30, 25 33, 24.5 42" stroke-width="2.2"/>
    <path d="M32 26.5 C36 30, 39 33, 39.5 42" stroke-width="2.2"/>
    <!-- H crossbar: petal closure -->
    <path d="M25.5 35.5 Q32 33.5 38.5 35.5" stroke-width="2.2"/>

    <!-- W: nested in the center as a four-stroke petal cluster (rose heart) -->
    <path d="M26 39 Q29 46 32 41 Q35 46 38 39" stroke-width="2.2"/>

    <!-- tiny curl at top of stem to suggest a rose leaf -->
    <path d="M32 7 Q35 8 35 11" stroke-width="2"/>
  </g>
</svg>
