<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="auth-layer" class="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-75 z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-80">
            <h2 class="text-2xl font-bold mb-4">Admin Login</h2>
            <input type="password" id="pwd-input" class="w-full border p-2 rounded mb-4" placeholder="Admin Password">
            <button onclick="verifyAdmin()" class="w-full bg-red-600 text-white py-2 rounded">Login</button>
        </div>
    </div>

    <div id="main-content" class="hidden container mx-auto p-4">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Admin Portal</h1>
            <a href="index.html" class="text-blue-500 hover:underline">← Back to Home</a>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Photo Upload -->
            <div class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-bold mb-4">Add Photo</h2>
                
                <!-- Drag and Drop Area -->
                <div id="drop-zone" class="border-2 border-dashed border-gray-400 rounded-lg p-8 text-center mb-4 hover:bg-gray-50 transition cursor-pointer" onclick="document.getElementById('file-input').click()">
                    <div class="text-gray-500 flex flex-col items-center">
                        <svg class="w-12 h-12 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <span class="font-medium" id="drop-text">Click to select or drag & drop image here</span>
                    </div>
                </div>
                <input type="file" id="file-input" class="hidden" accept="image/*">
                
                <select id="p-cat" class="w-full border p-2 rounded mb-4">
                    <option value="Culture">Culture</option>
                    <option value="Landscape">Landscape</option>
                    <option value="Portrait">Portrait</option>
                </select>
                <button onclick="addPhoto()" class="bg-green-600 text-white px-4 py-2 rounded w-full font-bold">Upload Photo</button>

                <h3 class="font-bold mt-6 mb-2">Photo List (Click to Delete)</h3>
                <div id="admin-photos" class="space-y-2 max-h-64 overflow-y-auto border p-2"></div>
            </div>

            <!-- Testimonials Management -->
            <div class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-bold mb-4">Manage Testimonials</h2>
                <div id="admin-testimonials" class="space-y-4 max-h-96 overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script>
        const API_BASE = (window.SAM_API_CONFIG && window.SAM_API_CONFIG.apiBase) || 'https://sam-api-backend.onrender.com/api';
        let adminPwd = '';
        let selectedBase64 = null;
        
        function escapeHTML(str) {
            if (str == null) return '';
            return String(str).replace(/[&<>'"]/g, (tag) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag]));
        }

        async function requestJson(path, options = {}) {
            const res = await fetch(`${API_BASE}${path}`, options);
            if (!res.ok) {
                throw new Error(`Request failed with status ${res.status}`);
            }
            const contentType = res.headers.get('content-type') || '';
            if (!contentType.includes('application/json')) {
                return null;
            }
            return res.json();
        }

        // --- 拖拽与图片压缩逻辑 ---
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-blue-50', 'border-blue-500'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('bg-blue-50', 'border-blue-500'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-blue-50', 'border-blue-500');
            handleFile(e.dataTransfer.files[0]);
        });
        
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return alert('Please select a valid image file.');
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1080;
                    const MAX_HEIGHT = 1080;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    } else if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    selectedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('drop-text').innerHTML = `<img src="${selectedBase64}" class="h-32 mx-auto object-cover rounded shadow">`;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
        // -------------------------

        async function verifyAdmin() {
            const pwd = document.getElementById('pwd-input').value;
            try {
                await requestJson('/hidden/photos', { headers: { 'x-password': pwd } });
                if (pwd) {
                    adminPwd = pwd;
                    document.getElementById('auth-layer').style.display = 'none';
                    document.getElementById('main-content').classList.remove('hidden');
                    loadAdminData();
                }
            } catch (err) {
                alert('Incorrect password or insufficient permissions');
            }
        }

        async function loadAdminData() {
            const photos = await requestJson('/hidden/photos', { headers: { 'x-password': adminPwd } });
            document.getElementById('admin-photos').innerHTML = photos.map(p => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="text-sm truncate w-2/3">${escapeHTML(p.category)} - ${escapeHTML((p.url || '').substring(0,20))}...</span>
                    <button onclick="deletePhoto(${JSON.stringify(String(p.id || ''))})" class="text-red-500 text-sm">Delete</button>
                </div>
            `).join('');

            const testimonials = await requestJson('/hidden/testimonials', { headers: { 'x-password': adminPwd } });
            document.getElementById('admin-testimonials').innerHTML = testimonials.map(t => `
                <div class="border p-2 rounded relative">
                    <button onclick="deleteTestimonial(${JSON.stringify(String(t.id || ''))})" class="absolute top-2 right-2 text-red-500 text-sm">Delete</button>
                    <strong>${escapeHTML(t.name)}</strong> (${escapeHTML(t.relationship)})<br>
                    <p class="text-sm mt-1">${escapeHTML(t.comment)}</p>
                </div>
            `).join('');
        }

        async function addPhoto() {
            const category = document.getElementById('p-cat').value;
            if (!selectedBase64) return alert('Please select an image first.');
            
            const uploadBtn = document.querySelector('button[onclick="addPhoto()"]');
            uploadBtn.innerText = 'Uploading...';
            try {
                await requestJson('/admin/photos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-password': adminPwd },
                body: JSON.stringify({ url: selectedBase64, category })
                });
                selectedBase64 = null;
                document.getElementById('drop-text').innerHTML = `Click to select or drag & drop image here`;
                await loadAdminData();
            } catch (e) {
                alert('Upload failed. Please try again.');
            } finally {
                uploadBtn.innerText = 'Upload Photo';
            }
        }

        async function deletePhoto(id) {
            if(!confirm('Are you sure you want to delete this photo?')) return;
            try {
                await requestJson(`/admin/photos/${encodeURIComponent(id)}`, { method: 'DELETE', headers: { 'x-password': adminPwd } });
                await loadAdminData();
            } catch (e) {
                alert('Delete failed. Please try again.');
            }
        }

        async function deleteTestimonial(id) {
            if(!confirm('Are you sure you want to delete this testimonial?')) return;
            try {
                await requestJson(`/admin/testimonials/${encodeURIComponent(id)}`, { method: 'DELETE', headers: { 'x-password': adminPwd } });
                await loadAdminData();
            } catch (e) {
                alert('Delete failed. Please try again.');
            }
        }
    </script>
</body>
</html>
