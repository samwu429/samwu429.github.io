<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="auth-layer" class="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-75 z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-80">
            <h2 class="text-2xl font-bold mb-4">管理员登录</h2>
            <input type="password" id="pwd-input" class="w-full border p-2 rounded mb-4" placeholder="Admin Password">
            <button onclick="verifyAdmin()" class="w-full bg-red-600 text-white py-2 rounded">登录</button>
        </div>
    </div>

    <div id="main-content" class="hidden container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-6">超级管理后台</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- 照片上传 -->
            <div class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-bold mb-4">添加照片</h2>
                <input type="text" id="p-url" placeholder="图片 URL 链接" class="w-full border p-2 rounded mb-2">
                <select id="p-cat" class="w-full border p-2 rounded mb-4">
                    <option value="人文">人文</option>
                    <option value="风景">风景</option>
                    <option value="人像">人像</option>
                </select>
                <button onclick="addPhoto()" class="bg-green-600 text-white px-4 py-2 rounded">添加</button>

                <h3 class="font-bold mt-6 mb-2">照片列表 (点击删除)</h3>
                <div id="admin-photos" class="space-y-2 max-h-64 overflow-y-auto border p-2"></div>
            </div>

            <!-- 评价管理 -->
            <div class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-bold mb-4">评价管理</h2>
                <div id="admin-testimonials" class="space-y-4 max-h-96 overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://sam-backend-s2z9.onrender.com/api'; // 请调整
        let adminPwd = '';

        async function verifyAdmin() {
            const pwd = document.getElementById('pwd-input').value;
            try {
                const res = await fetch(`${API_BASE}/hidden/photos`, { headers: { 'x-password': pwd } });
                if (res.ok && pwd === '0429') { // 验证是不是管理员密码
                    adminPwd = pwd;
                    document.getElementById('auth-layer').style.display = 'none';
                    document.getElementById('main-content').classList.remove('hidden');
                    loadAdminData();
                } else {
                    alert('密码错误或权限不足');
                }
            } catch (err) { alert('错误'); }
        }

        async function loadAdminData() {
            const pRes = await fetch(`${API_BASE}/hidden/photos`, { headers: { 'x-password': adminPwd } });
            const photos = await pRes.json();
            document.getElementById('admin-photos').innerHTML = photos.map(p => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="text-sm truncate w-2/3">${p.category} - ${p.url.substring(0,20)}...</span>
                    <button onclick="deletePhoto('${p.id}')" class="text-red-500 text-sm">删除</button>
                </div>
            `).join('');

            const tRes = await fetch(`${API_BASE}/hidden/testimonials`, { headers: { 'x-password': adminPwd } });
            const testimonials = await tRes.json();
            document.getElementById('admin-testimonials').innerHTML = testimonials.map(t => `
                <div class="border p-2 rounded relative">
                    <button onclick="deleteTestimonial('${t.id}')" class="absolute top-2 right-2 text-red-500 text-sm">删除</button>
                    <strong>${t.name}</strong> (${t.relationship})<br>
                    <p class="text-sm mt-1">${t.comment}</p>
                </div>
            `).join('');
        }

        async function addPhoto() {
            const url = document.getElementById('p-url').value;
            const category = document.getElementById('p-cat').value;
            if (!url) return alert('输入URL');
            
            await fetch(`${API_BASE}/admin/photos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-password': adminPwd },
                body: JSON.stringify({ url, category })
            });
            document.getElementById('p-url').value = '';
            loadAdminData();
        }

        async function deletePhoto(id) {
            if(!confirm('确定删除这张照片？')) return;
            await fetch(`${API_BASE}/admin/photos/${id}`, { method: 'DELETE', headers: { 'x-password': adminPwd } });
            loadAdminData();
        }

        async function deleteTestimonial(id) {
            if(!confirm('确定删除这条评价？')) return;
            await fetch(`${API_BASE}/admin/testimonials/${id}`, { method: 'DELETE', headers: { 'x-password': adminPwd } });
            loadAdminData();
        }
    </script>
</body>
</html>
