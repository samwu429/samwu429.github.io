<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moments | Sam Wu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css?v=12">
</head>
<body class="animate-fade-in py-6 md:py-12 px-0 min-h-screen flex flex-col relative overflow-x-hidden">

    <div class="site-wrap w-full mb-8 flex justify-between items-center relative z-10 border-b-2 border-gray-900 pb-4">
        <a href="index.html" class="retro-button px-6 py-2.5 text-xs font-black uppercase tracking-widest text-gray-800 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Back to Hub
        </a>
        <a href="publications.html" class="text-xs font-black uppercase tracking-widest text-emerald-800 hidden sm:inline">Publications →</a>
    </div>

    <div class="site-wrap w-full max-w-7xl mx-auto flex-1 relative z-10 pb-24">
        <div class="retro-panel p-4 md:p-5 bg-white mb-10 flex items-center gap-4">
            <div class="w-16 h-16 retro-panel p-0.5 bg-emerald-50 flex-shrink-0 overflow-hidden">
                <img src="f702013468e4d300dc33d4c1bfd12f82.jpg" alt="" class="w-full h-full object-cover border border-gray-900" width="64" height="64">
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-black text-gray-950 tracking-tight">Sam Wu</h1>
                <p class="text-[11px] font-bold text-gray-500 uppercase tracking-widest mt-1">Moments · notes & snapshots</p>
            </div>
        </div>

        <div id="moments-feed" class="space-y-8 max-w-5xl mx-auto"></div>
    </div>

    <div id="moments-lightbox" class="fixed inset-0 hidden items-center justify-center z-[120] bg-black/85 p-4 md:p-8" aria-hidden="true">
        <button type="button" id="moments-lightbox-close" class="retro-button absolute top-4 right-4 px-3 py-1.5 text-[11px] uppercase tracking-widest">Close</button>
        <img id="moments-lightbox-img" src="" alt="" class="max-w-full max-h-[88vh] border-2 border-gray-900 shadow-[8px_8px_0px_#1c1917] bg-white object-contain">
    </div>

    <script src="api-config.js"></script>
    <script src="moments-public.js?v=10"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const MC = window.SAM_PUBLIC_CONTENT;
            if (!MC) return;
            const feed = document.getElementById('moments-feed');
            const lightbox = document.getElementById('moments-lightbox');
            const lightboxImg = document.getElementById('moments-lightbox-img');
            const closeBtn = document.getElementById('moments-lightbox-close');

            function closeLightbox() {
                if (!lightbox || !lightboxImg) return;
                lightbox.classList.add('hidden');
                lightbox.classList.remove('flex');
                lightbox.setAttribute('aria-hidden', 'true');
                lightboxImg.src = '';
            }

            function openLightbox(src, alt) {
                if (!lightbox || !lightboxImg || !src) return;
                lightboxImg.src = src;
                lightboxImg.alt = alt || '';
                lightbox.classList.remove('hidden');
                lightbox.classList.add('flex');
                lightbox.setAttribute('aria-hidden', 'false');
            }

            if (feed) {
                feed.addEventListener('click', (e) => {
                    const img = e.target && e.target.closest('.moments-thumb img');
                    if (!img) return;
                    openLightbox(img.getAttribute('src') || '', img.getAttribute('alt') || '');
                });
            }
            if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
            if (lightbox) {
                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox) closeLightbox();
                });
            }
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeLightbox();
            });

            MC.loadMomentsFeed(feed, {});
        });
    </script>
</body>
</html>
